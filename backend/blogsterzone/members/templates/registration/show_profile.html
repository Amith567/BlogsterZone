{% extends 'base.html'%}
{% block content%}
{% load static%}


<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
        {% if page_user.profile_pic%}

      <img src="{{ page_user.profile_pic.url }}" class="img-fluid rounded-start" >
      {%else%}
            <img src="{% static 'ablog/images/profile.png'%}" class="img-fluid rounded-start" >

      {% endif%}
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">{{page_user}}</h5>
        <p class="card-text">{{page_user.bio}}</p>
        <a href="{{page_user.facebook_url}}">facebook</a>
        <a href="{{page_user.websit_url}}">website</a>
        
   
      </div>
    </div>
  </div>
</div>

{% endblock%}
